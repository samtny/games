<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Games</title>
<style>
  :root { --bg: #05060f; --fg: #e8ecff; --dim: #8a93c0; --card: #0d1024; --line: #232a52; --accent: #6cf0ff; --accent2: #ff6cd0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: clamp(32px, 8vw, 48px); letter-spacing: 0.02em; }
  p.lead { margin: 0 0 28px; color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.card canvas { display: block; width: 100%; height: 170px; background: radial-gradient(circle at 50% 45%, #141a3d, #05060f 70%); }
  .body { padding: 14px 16px 18px; }
  .body h2 { margin: 0 0 6px; font-size: 20px; }
  .body p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
  .tag { display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Games</h1>
  <p class="lead">Small browser games. Tap one to play.</p>
  <div class="grid">
    <a class="card" href="superformula-squadron/">
      <canvas id="sfPreview" aria-hidden="true"></canvas>
      <div class="body">
        <h2>Superformula Squadron</h2>
        <p>A seeded vertical shooter whose enemy fleets and bosses are grown from the Gielis superformula. Drag to fly, guns fire automatically.</p>
        <span class="tag">Mobile friendly · Touch</span>
      </div>
    </a>
  </div>
</main>
<script>
// Animated superformula thumbnail for the card.
(function () {
  const c = document.getElementById('sfPreview');
  const g = c.getContext('2d');
  function sf(phi, m, n1, n2, n3) {
    const t = Math.pow(Math.abs(Math.cos(m * phi / 4)), n2) + Math.pow(Math.abs(Math.sin(m * phi / 4)), n3);
    return t > 0 ? Math.pow(t, -1 / n1) : 0;
  }
  function size() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    c.width = c.clientWidth * d; c.height = c.clientHeight * d;
  }
  function draw(t) {
    const w = c.width, h = c.height, R = Math.min(w, h) * 0.38;
    g.clearRect(0, 0, w, h);
    const u = (Math.sin(t / 1600) + 1) / 2;
    const m = 5 + Math.round(u * 3), n1 = 0.4 + u * 1.4, n2 = 1.5 + u * 4, n3 = 1.5 + (1 - u) * 6;
    const N = 240, rs = [];
    let max = 0;
    for (let i = 0; i < N; i++) { const r = sf(i / N * Math.PI * 2, m, n1, n2, n3); rs.push(r); if (r > max) max = r; }
    [[1, '#6cf0ff', 0.9], [0.62, '#b38cff', 0.6], [0.32, '#ff6cd0', 0.8]].forEach(([k, col, a]) => {
      g.beginPath();
      for (let i = 0; i < N; i++) {
        const phi = i / N * Math.PI * 2 + t / 5000;
        const r = (rs[i] / max) * R * k;
        const x = w / 2 + Math.cos(phi) * r, y = h / 2 + Math.sin(phi) * r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
      g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 2; g.stroke();
    });
    g.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  size();
  window.addEventListener('resize', size);
  if (still) draw(0); else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
